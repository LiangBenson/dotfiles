# Minimal gruvbox-inspired status line with clear active window tabs.
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 5

set -g status-style 'bg=#282828,fg=#ebdbb2'
set -g message-style 'bg=#458588,fg=#fbf1c7'
set -g message-command-style 'bg=#458588,fg=#fbf1c7'
set -g pane-border-style 'fg=#504945'
set -g pane-active-border-style 'fg=#504945'

set -g status-left-length 24
set -g status-right-length 48
set -g status-left ''
set -g status-right '#[fg=#a89984,bg=#282828]#S #[fg=#282828,bg=#83a598] %H:%M '

set -g window-status-separator ' '
set -g window-status-format '#[fg=#d5c4a1,bg=#3c3836]  #I:#W  '
set -g window-status-current-format '#[fg=#1d2021,bg=#fabd2f,bold]  #I:#W  '

set -g window-status-style 'fg=#d5c4a1,bg=#3c3836'
set -g window-status-current-style 'fg=#1d2021,bg=#fabd2f,bold'
set -g window-status-last-style 'fg=#1d2021,bg=#8ec07c'
set -g window-status-bell-style 'fg=#1d2021,bg=#fb4934,bold'
