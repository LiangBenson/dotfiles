# Soft pastel status line: top, transparent, text-only tabs.
# Colors are Catppuccin Frappé (https://catppuccin.com/palette), the same
# palette as the terminal theme in ghostty/.config/ghostty/config, so the bar
# and the terminal match. The bar has no background of its own.
#   base #303446  surface1 #51576d  surface2 #626880  overlay0 #737994
#   overlay1 #838ba7  text #c6d0f5
#   blue #8caaee  lavender #babbf1  mauve #ca9ee6
#   peach #ef9f76  yellow #e5c890  red #e78284
# -q on newer options so older tmux on remote hosts doesn't complain.

# Two rows: the bar, then a blank row as breathing room above the content.
set -g status 2
set -g status-format[1] ''
set -g status-position top
set -g status-justify left
set -g status-interval 5
set -g status-style 'bg=default,fg=#737994'

# Left: session name (peach while the prefix is held, red note when F12 has
# handed the keys to a nested tmux).
set -g status-left-length 40
set -g status-left ' #{?#{==:#{client_key_table},off},#[fg=#e78284]keys off  ,}#{?client_prefix,#[fg=#ef9f76],#[fg=#8caaee]}#S  #[fg=#51576d]│  '

# Right: zoom marker, and the hostname only on ssh hosts.
set -g status-right-length 48
set -g status-right '#{?window_zoomed_flag,#[fg=#e5c890]zoom  ,}#{?@remote,#[fg=#ef9f76]#h  ,}'

# Tabs: muted text (number dimmer than the name), current one in mauve,
# peach dot when a window rang the bell (e.g. Claude waiting for you in
# another window).
set -g window-status-separator '   '
set -g window-status-format '#[fg=#626880]#I #[fg=#838ba7]#W#{?window_bell_flag,#[fg=#ef9f76] ●,}'
set -g window-status-current-format '#[fg=#ca9ee6,bold]#I #W'
set -g window-status-style 'default'
set -g window-status-current-style 'default'
set -g window-status-last-style 'default'
set -g window-status-bell-style 'default'
set -g window-status-activity-style 'default'

# Panes: one faint border color everywhere. Giving the active pane its own
# color makes tmux paint only the part of a line that touches that pane (half
# the divider in a two-pane window), which looks like a glitch.
set -g pane-border-style 'fg=#51576d'
set -g pane-active-border-style 'fg=#51576d'
set -gq pane-border-indicators off
set -gq pane-border-lines single
set -g display-panes-colour '#737994'
set -g display-panes-active-colour '#ca9ee6'

# Messages, copy mode, menus.
set -g message-style 'bg=default,fg=#8caaee'
set -g message-command-style 'bg=default,fg=#8caaee'
set -g mode-style 'bg=#51576d,fg=#c6d0f5'
set -gq copy-mode-match-style 'bg=#51576d,fg=#e5c890'
set -gq copy-mode-current-match-style 'bg=#e5c890,fg=#303446'
set -g clock-mode-colour '#babbf1'
set -gq popup-border-lines rounded
set -gq popup-border-style 'fg=#51576d'
set -gq menu-border-lines rounded
set -gq menu-border-style 'fg=#51576d'
set -gq menu-selected-style 'bg=#51576d,fg=#c6d0f5'
