set -g default-shell /bin/zsh
set -g default-command /bin/zsh

unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -g escape-time 0
set -g focus-events on

if-shell 'infocmp -x tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

set -as terminal-overrides ',*:Tc'
if-shell '[ -f ~/.tmux/gruvbox-theme.conf ]' 'source-file ~/.tmux/gruvbox-theme.conf'

unbind %
unbind '"'

bind-key c new-window
bind-key r source-file ~/.tmux.conf \; display-message "tmux config reloaded"
bind-key C-\\ split-window -h -c "#{pane_current_path}"
bind-key C-_ split-window -v -c "#{pane_current_path}"
bind-key C-- split-window -v -c "#{pane_current_path}"
bind -n C-h run-shell "~/.tmux/tmux-nav.sh left '#{pane_id}'"
bind -n C-j run-shell "~/.tmux/tmux-nav.sh down '#{pane_id}'"
bind -n C-k run-shell "~/.tmux/tmux-nav.sh up '#{pane_id}'"
bind -n C-l run-shell "~/.tmux/tmux-nav.sh right '#{pane_id}'"
bind C-l send-keys 'C-l'

bind-key -r C-j resize-pane -D 10
bind-key -r C-k resize-pane -U 10
bind-key -r C-h resize-pane -L 10
bind-key -r C-l resize-pane -R 10

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

if-shell '[ -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux ]' \
  'run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux'

if-shell '[ -f ~/.tmux/plugins/tmux-continuum/continuum.tmux ]' \
  'run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux'
