# ── Shell ────────────────────────────────────────────────────────────────
# Use whatever the login shell is on this machine (zsh here, maybe bash on a
# remote host) instead of a hardcoded path.
set -g default-shell "${SHELL}"
set -g default-command "${SHELL}"

# ── Prefix ───────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

# ── General ──────────────────────────────────────────────────────────────
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename-format '#{b:pane_current_path}'
set -sg escape-time 10             # 0 is fine locally, but drops keys over slow ssh links
set -g focus-events on
set -g display-time 2000
set -g detach-on-destroy off      # closing a session switches to the next one
setw -g aggressive-resize on      # size windows to the client looking at them

# Clipboard: copy through the terminal (OSC 52), so it also works over ssh.
set -g set-clipboard on

# ── Terminal / colors ────────────────────────────────────────────────────
if-shell 'infocmp -x tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -as terminal-overrides ',*:Tc'

# ── Claude Code ──────────────────────────────────────────────────────────
# Shift+Enter for newlines, and notifications/images reaching the terminal.
# -q: older tmux on remote hosts skips options it doesn't know.
set -sq extended-keys on
set -asq terminal-features 'xterm*:extkeys'
set -gq allow-passthrough on

# ── Titles (terminal tab shows "session · folder", plus host over ssh) ───
set -g set-titles on
set -g set-titles-string '#{?@remote,#h · ,}#S · #W'

# ── SSH ──────────────────────────────────────────────────────────────────
# Mark servers started over ssh; the theme shows the hostname for them.
if-shell '[ -n "$SSH_CONNECTION" ]' 'set -g @remote 1'

# Nested tmux (local tmux -> ssh -> remote tmux): F12 hands all keys to the
# inner tmux, F12 again takes them back. The status bar shows "keys off".
bind -T root F12 set prefix None \; set key-table off \; refresh-client -S
bind -T off F12 set -u prefix \; set -u key-table \; refresh-client -S

# ── Theme ────────────────────────────────────────────────────────────────
if-shell '[ -f ~/.tmux/catppuccin-theme.conf ]' 'source-file ~/.tmux/catppuccin-theme.conf'

# ── Windows and panes ────────────────────────────────────────────────────
unbind %
unbind '"'

bind-key c new-window -c "#{pane_current_path}"
bind-key r source-file ~/.tmux.conf \; display-message " tmux config reloaded"
bind-key C-\\ split-window -h -c "#{pane_current_path}"
bind-key C-_ split-window -v -c "#{pane_current_path}"
bind-key C-- split-window -v -c "#{pane_current_path}"

# prefix + g: open the markdown file Claude just wrote in glow, in a pane on
# the right (q closes it). See ~/.tmux/open-md.sh for how it picks the file.
bind-key g run-shell "~/.tmux/open-md.sh '#{pane_id}'"

# prefix + G: lazygit over the current pane's folder, for reviewing what Claude
# changed (q closes it). A full-size popup on tmux 3.2+, a new window on older
# tmux.
if-shell 'tmux list-commands | grep -q "^display-popup"' \
  'bind-key G display-popup -E -w 100% -h 100% -d "#{pane_current_path}" lazygit' \
  'bind-key G new-window -c "#{pane_current_path}" lazygit'

# C-h/j/k/l move between panes (and into Neovim splits). With a single or
# zoomed pane the key goes to the program instead, so C-j / C-l still work
# in Claude Code and the shell.
bind -n C-h run-shell "~/.tmux/tmux-nav.sh left '#{pane_id}'"
bind -n C-j run-shell "~/.tmux/tmux-nav.sh down '#{pane_id}'"
bind -n C-k run-shell "~/.tmux/tmux-nav.sh up '#{pane_id}'"
bind -n C-l run-shell "~/.tmux/tmux-nav.sh right '#{pane_id}'"

bind-key -r C-j resize-pane -D 10
bind-key -r C-k resize-pane -U 10
bind-key -r C-h resize-pane -L 10
bind-key -r C-l resize-pane -R 10

# ── Copy mode (vi keys: v select, C-v block, y copy) ─────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── Plugins (session save/restore) ───────────────────────────────────────
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

if-shell '[ -f ~/.tmux/plugins/tmux-resurrect/resurrect.tmux ]' \
  'run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux'

if-shell '[ -f ~/.tmux/plugins/tmux-continuum/continuum.tmux ]' \
  'run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux'
